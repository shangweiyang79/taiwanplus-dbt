# CI：每個 PR（以及 main 的每次 push）自動驗證。綠燈才合併進 main。
#   chatbox-tests  chatbox 的規則與 CA client 單元測試，不需要 GCP
#   dbt-build      整個專案建進 dbt_ci dataset 並跑全部 test，不碰 dev / prod
# CD：只在 main 上、上面兩個 job 都綠燈後執行。
#   deploy         refresh_* stored procedure、workflow youtube-owner-chain（自動）
#   deploy-dbt     dbt build --target prod（自動；合併前 dbt-build 已在 dbt_ci 跑過同一份程式碼）
#   deploy-checks  dbt-daily-checks 映像（deploy-dbt 成功後才換）
#
# GCP 認證走 Workload Identity Federation：GitHub 簽發的 OIDC token 換成 dbt-ci / dbt-deployer / dbt-prod SA 的
# 短期憑證，repo 與 secrets 裡都沒有 SA 金鑰。設定方式見 orchestration/README.md。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chatbox-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatbox_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chatbox_app/requirements.txt
      - run: pip install -r requirements.txt
      # 與 chatbox_app/Dockerfile 的 build 檢查相同；import 只需要一個專案 ID 字串
      - run: python test_notes.py && python test_ca_client.py && python -c "import ca_client, notes, config, narrator"
        env:
          GCP_PROJECT: build-check

  dbt-build:
    # fork 來的 PR 拿不到 OIDC token 與 secrets，直接跳過
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # 讓 google-github-actions/auth 取得 OIDC token
    # 所有執行共用同一個 dbt_ci dataset，一次只跑一個，避免互相覆蓋
    concurrency:
      group: dbt-ci
      cancel-in-progress: false
    env:
      DBT_PROFILES_DIR: profiles
      DBT_ENGINE_NO_WARN_SEMANTIC_MANIFEST_VALIDATION: "1"   # semantic layer 驗證要 dbt platform，本機與 CI 都跳過
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 與本機、每日檢查 job 同一版
      - run: pip install dbt==2.0.9
      - run: dbt build --target ci

  # ---- CD：只在 main 上、CI 兩個 job 都綠燈後執行 ----
  # 每次合併都把 main 的版本整套推上去（每一步都可重複執行），手動改過的設定也會被拉回來。

  # 1. 不碰 dbt 的部分
  deploy:
    needs: [chatbox-tests, dbt-build]
    # 只部署 main；WIF 也只讓 main 的 OIDC sub 換成 dbt-deployer，兩邊都擋
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # 連續合併時依序部署，不中斷正在跑的部署
    concurrency:
      group: deploy-infra
      cancel-in-progress: false
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      REGION: asia-east1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # 先換 procedure，workflow 才不會呼叫到還不存在的 procedure
      - name: refresh_* stored procedures
        run: |
          for f in orchestration/sql/*.sql; do
            bq --project_id="$GCP_PROJECT" --location="$REGION" query --use_legacy_sql=false --quiet < "$f"
            echo "$(basename "$f" .sql)"
          done
      - name: workflow youtube-owner-chain
        run: |
          gcloud workflows deploy youtube-owner-chain --source=orchestration/youtube_owner_chain.yaml \
            --location="$REGION" --service-account="yt-chain@$GCP_PROJECT.iam.gserviceaccount.com" \
            --project="$GCP_PROJECT"

  # 2. dbt 的 prod model。不另設人工核准：合併 PR 就是確認，dbt-build 也已經在 dbt_ci 建過、測過
  deploy-dbt:
    needs: [chatbox-tests, dbt-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # WIF 只讓 main 的 OIDC sub 換成 dbt-prod
    permissions:
      contents: read
      id-token: write
    # 連續合併時依序部署；排隊中的舊執行會被新的取代（反正每次都部署整個 main）
    concurrency:
      group: deploy-dbt
      cancel-in-progress: false
    env:
      DBT_PROFILES_DIR: profiles
      DBT_ENGINE_NO_WARN_SEMANTIC_MANIFEST_VALIDATION: "1"
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install dbt==2.0.9
      # 全部重建：model 全是 view，重建一次只要幾分鐘，也不用維護 prod 的 manifest
      - run: dbt build --target prod

  # 3. 每日檢查的映像：view 更新之後才換，不然新的 test 會去查舊的 view
  deploy-checks:
    needs: [deploy-dbt]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-checks
      cancel-in-progress: false
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      REGION: asia-east1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # 映像用 commit SHA 當 tag，從 job 的設定就查得到跑的是哪一版
      - name: dbt-daily-checks 映像
        run: |
          IMAGE="$REGION-docker.pkg.dev/$GCP_PROJECT/cloud-run-source-deploy/dbt-daily-checks:$GITHUB_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          gcloud run jobs update dbt-daily-checks --image="$IMAGE" --region="$REGION" --project="$GCP_PROJECT"
