name: taiwanplus_dbt
version: "1.0.0"
config-version: 2
profile: taiwanplus_dbt

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

# 所有 description 都寫回 BigQuery 的 table / column 描述，
# 讓 BQ 的 Gemini / Conversational Analytics 也讀得到同一份定義。
models:
  taiwanplus_dbt:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: view
    # 與舊 social_hub view 同名的相容層。prod 時寫回 social_hub（見 macros/generate_schema_name.sql），
    # Looker Studio 不用重接；dev 時一律寫進 target.schema。
    social_hub:
      +materialized: view
      +schema: social_hub

seeds:
  taiwanplus_dbt:
    +persist_docs:
      relation: true
      columns: true
    dept_accounts:
      +column_types:
        active_to: date
