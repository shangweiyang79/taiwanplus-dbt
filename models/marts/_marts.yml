version: 2

models:
  - name: time_spine_daily
    description: 一列 = 一天，給 semantic layer 做時間彙總用的日期表。
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: 日期
        granularity: day

  - name: fct_social_post_performance
    description: "{{ doc('fct_social_post_performance') }}"

    semantic_model:
      enabled: true
      name: social_post
    agg_time_dimension: publish_date

    columns:
      - name: post_uid
        description: 貼文唯一鍵，格式為 `平台:貼文 ID`。
        entity:
          name: post
          type: primary
        data_tests: [unique, not_null]

      - name: vod_id
        description: CMS 的 VOD ID。只有 Newsroom 且走過 CMS 發布流程的貼文才有，其餘為 NULL。
        entity:
          name: vod
          type: foreign

      - name: platform
        description: "{{ doc('platform') }}"
        dimension:
          type: categorical
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['YouTube', 'Instagram', 'Facebook', 'X']

      - name: dept_scope
        description: "{{ doc('dept_scope') }}"
        dimension:
          type: categorical
          label: 新聞部單位
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['newsroom', 'talks', 'connected']

      - name: post_key
        description: 平台上的貼文 ID（YouTube video_id、IG shortcode、FB video_id、X post_id）。

      - name: link
        description: 貼文連結，取自各平台原表。

      - name: publish_date
        description: 貼文在該平台的發布日（不是 VOD 的 publish_date）。semantic layer 的預設時間維度。
        granularity: day
        dimension:
          type: time

      - name: year_month
        description: 發布月份字串（YYYY-MM）。

      - name: month_start
        description: 發布月份第一天，給 Looker Studio 的日期控制項使用。

      - name: platform_title
        description: 平台上的標題。YouTube、FB、X 有值；IG 為 NULL。

      - name: caption
        description: 貼文文案。IG 只有 Newsroom 在 2025-06-02 之後有值；YouTube 為 NULL。

      - name: thumbnail_url
        description: 縮圖網址。IG、FB 是會過期的 Meta CDN 簽章網址。

      - name: views
        # 完整定義放在表格描述（BigQuery 欄位描述上限 1,024 字元，放不下）
        description: >
          影片觀看數（各平台原生指標：YouTube Views、IG Plays、FB 3-second video views、X Video views）。
          各平台計算門檻與受眾不同，不可跨平台比較優劣；YouTube 於 2026-08-27 放寬門檻，跨期比較時另附 engaged_views 參考。
          完整定義見表格說明。

      - name: engaged_views
        description: >
          YouTube 的 Engaged views（輔助參考），其他平台為 NULL。計算方式接近 2026-08-27 之前的舊 Views。
          KPI 仍是 views；跨 8/27 比較時一併列出這欄，說明 views 的變化有多少來自定義放寬。

      - name: watch_time_hours
        description: 觀看時長（小時）。X 不提供，為 NULL。

      - name: engagements
        description: 互動數。YouTube = 讚 + 留言 + 分享；IG = Reels interactions + Shares；FB = 原生 engagements；X = 讚 + 回覆 + 轉推。

      - name: impressions
        description: 曝光次數，只有 YouTube 有。

      - name: ctr
        description: 縮圖點閱率，只有 YouTube 有。

      - name: orientation
        description: 平台自己的影片形式（shorts / reels / video）。X 的 'video' 代表「無此資訊」，不代表橫式。
        dimension:
          type: categorical

      - name: is_vertical
        description: 是否為直式影片（跨平台正規化）。X 一律為 FALSE（無此資訊），比較直式成效時應排除 X。
        dimension:
          type: categorical

      - name: is_in_post_map
        description: 這則貼文是否走過 CMS 發布流程（有 VOD ID）。
        dimension:
          type: categorical

      - name: program
        description: 節目名稱（只有 Newsroom 的 VOD 有）。
        dimension:
          type: categorical

      - name: content_category
        description: CMS 的內容分類（只有 Newsroom 的 VOD 有）。
        dimension:
          type: categorical

      - name: new_category
        description: 主題分類（9 大類，雲端分類 pipeline 產出，只有 Newsroom 的 VOD 有）。
        dimension:
          type: categorical

      - name: tags_text
        description: 正規化後的 tag，以逗號串接。

    metrics:
      - name: video_views
        label: 影片層觀看數（依發布日累計）
        description: >
          影片層：該期間「發布」的影片，到今天為止的累計觀看。用於影片 / 主題 / 節目 / 原因分析，
          不用於總體成效（總體成效用 traffic_views）。各平台門檻見 platform_metric_glossary。
        type: simple
        agg: sum
        expr: views

      - name: yt_video_views
        label: YouTube 觀看數
        description: >
          YouTube 的 Views（total_views），是 KPI。2026-08-27 起門檻由約 30 秒放寬為約 1 秒，
          跨 8/27 比較時另附 yt_engaged_views 參考。
        type: simple
        agg: sum
        expr: views
        filter: "{{ Dimension('post__platform') }} = 'YouTube'"

      - name: ig_video_views
        label: Instagram 播放數
        description: Instagram 的 Plays（Total Plays，取最新快照）。
        type: simple
        agg: sum
        expr: views
        filter: "{{ Dimension('post__platform') }} = 'Instagram'"

      - name: fb_video_views
        label: Facebook 3 秒觀看數
        description: >
          Facebook 的 3-second video views（video_views_3s），播放滿 3 秒才計，是四個平台中門檻最嚴格的。
          FB 數字大是因為受眾以菲律賓為主、菲律賓相關新聞表現特別好，不是門檻低。
        type: simple
        agg: sum
        expr: views
        filter: "{{ Dimension('post__platform') }} = 'Facebook'"

      - name: x_video_views
        label: X 影片觀看數
        description: X 的 Video views（total_video_views）。
        type: simple
        agg: sum
        expr: views
        filter: "{{ Dimension('post__platform') }} = 'X'"

      - name: yt_engaged_views
        label: YouTube Engaged views
        description: >
          YouTube 的 Engaged views，計算方式接近 2026-08-27 之前的舊 Views。
          輔助參考用，KPI 仍是 yt_video_views；期間跨過 8/27 時一併列出，說明 Views 的變化有多少來自定義放寬。
        type: simple
        agg: sum
        expr: engaged_views
        filter: "{{ Dimension('post__platform') }} = 'YouTube'"

      - name: watch_time_hours
        label: 觀看時長（小時）
        description: 觀看時長加總。X 不提供，所以跨平台加總只含 YouTube + IG + FB。
        type: simple
        agg: sum
        expr: watch_time_hours

      - name: engagements
        label: 互動數
        description: 互動數加總，各平台定義見 engagements 欄位說明。
        type: simple
        agg: sum
        expr: engagements

      - name: impressions
        label: 曝光數（僅 YouTube）
        description: 縮圖曝光次數，只有 YouTube 有，不是跨平台指標。
        type: simple
        agg: sum
        expr: impressions

      - name: post_count
        label: 影片貼文數
        description: 影片貼文數。
        type: simple
        agg: count
        expr: post_uid

      - name: engagement_rate
        label: 互動率
        description: 互動數 / 影片觀看數。各平台觀看與互動定義都不同，只能在同一平台內比較。
        type: ratio
        numerator: engagements
        denominator: video_views

      - name: avg_views_per_post
        label: 平均每則觀看數
        description: 影片觀看數 / 影片貼文數。少數爆量貼文會把平均拉高，建議同時看中位數或最大值。
        type: ratio
        numerator: video_views
        denominator: post_count

  - name: agg_news_dept_social_monthly
    description: >
      一列 = 月 × 新聞部單位 × 平台，新聞部社群成效的認證匯總表。
      常見問題（新聞部 / 各單位 / 各平台的逐月成效）直接查這張，不要從明細自己加總。
      {{ doc('news_dept_definition') }}
      {{ doc('video_views_definition') }}
    columns:
      - name: month_start
        description: 月份第一天（依各平台發布日）。
        data_tests: [not_null]
      - name: year_month
        description: 月份字串（YYYY-MM）。
      - name: dept_scope
        description: "{{ doc('dept_scope') }}"
      - name: platform
        description: "{{ doc('platform') }}"
      - name: video_views
        description: 影片觀看數，各平台計算門檻不同（見表格說明），不可跨平台比較優劣。YouTube 於 2026-08-27 放寬門檻。
      - name: engaged_views
        description: YouTube 的 Engaged views（輔助參考，其他平台為 NULL）。KPI 仍是 video_views；跨 2026-08-27 比較時一併列出。
      - name: post_count
        description: 影片貼文數。
      - name: watch_time_hours
        description: 觀看時長（小時）。X 沒有，為 NULL。
      - name: engagements
        description: 互動數，各平台定義見 fct_social_post_performance.engagements。
      - name: engagement_rate
        description: 互動數 / 影片觀看數。只能在同一平台內比較。
      - name: avg_views_per_post
        description: 平均每則觀看數。易受少數爆量貼文影響，請搭配 max_views_per_post 判讀。
      - name: max_views_per_post
        description: 單則最高觀看數，用來判斷平均值是否被爆量貼文拉高。
      - name: is_current_month
        description: 是否為本月（台北時間）。本月資料不完整，數字天生偏低。
      - name: days_since_month_end
        description: 該月最後一天距今幾天。負數 = 本月尚未結束；數字愈小，累計愈不完整。

  - name: fct_daily_traffic
    description: "{{ doc('fct_daily_traffic') }}"

    semantic_model:
      enabled: true
      name: daily_traffic
    agg_time_dimension: date

    columns:
      - name: traffic_uid
        description: 唯一鍵，格式為 `日期:單位:平台:內容類型`。
        entity:
          name: traffic
          type: primary
        data_tests: [unique, not_null]
      - name: date
        description: 觀看發生的日期（不是影片發布日）。
        granularity: day
        dimension:
          type: time
        data_tests: [not_null]
      - name: year_month
        description: 月份字串（YYYY-MM）。
      - name: month_start
        description: 月份第一天。
      - name: dept_scope
        description: "{{ doc('dept_scope') }}"
        dimension:
          type: categorical
          label: 新聞部單位
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['newsroom', 'talks', 'connected']
      - name: platform
        description: "{{ doc('platform') }}"
        dimension:
          type: categorical
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['YouTube', 'Instagram', 'Facebook', 'X']
      - name: content_type
        description: 內容類型：`video`（影片 / reels）或 `story`（IG 影片類 Stories）。
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: ['video', 'story']
      - name: views
        description: >
          當天實際發生的觀看數，是總體成效的 KPI。YouTube / FB 含付費觀看；IG 2026-06-01 之前為逐支 reel 快照相減（通常比 API 偏高 10～20%）。
          各平台門檻不同，不可跨平台比較優劣。
      - name: paid_views
        description: 付費觀看（YouTube、FB、IG 有欄位；X 為 NULL）。
      - name: engaged_views
        description: YouTube 的 Engaged views（輔助參考，其他平台為 NULL）。KPI 仍是 views。
      - name: watch_time_hours
        description: 當天的觀看時數。IG 與 IG 每日報表同一份數字（2026-10-25 前為人工校正的歷史，之後逐支 reel 快照相減，沒有負數）；FB 由分鐘換算；Stories 為 NULL。
      - name: source_method
        description: >
          資料算法：youtube_analytics / facebook_insights / x_analytics / api（IG 2026-06-01 起）/
          reel_snapshot_delta（IG 2026-06-01 前，逐支 reel 快照相減）/ story_by_publish_date（IG Stories）。
        dimension:
          type: categorical

    metrics:
      - name: traffic_views
        label: 每日流量觀看數（總體成效 KPI）
        description: "{{ doc('traffic_vs_video_level') }}"
        type: simple
        agg: sum
        expr: views

      - name: traffic_engaged_views
        label: 每日流量 Engaged views（YouTube）
        description: YouTube 每天的 Engaged views，輔助參考用（KPI 仍是 traffic_views）。
        type: simple
        agg: sum
        expr: engaged_views

      - name: traffic_story_views
        label: IG Stories 觀看數
        description: IG 影片類 Stories 的觀看，已包含在 traffic_views 裡。
        type: simple
        agg: sum
        expr: views
        filter: "{{ Dimension('traffic__content_type') }} = 'story'"

      - name: traffic_paid_views
        label: 每日流量付費觀看
        description: 付費觀看，已包含在 traffic_views 裡。
        type: simple
        agg: sum
        expr: paid_views

      - name: traffic_watch_time_hours
        label: 每日流量觀看時數
        description: 當天的觀看時數加總（Stories 不含）。
        type: simple
        agg: sum
        expr: watch_time_hours

  - name: agg_news_dept_daily_traffic_monthly
    description: >
      一列 = 月 × 新聞部單位 × 平台，新聞部「總體成效」的認證匯總表（每日流量）。
      問總體成效、趨勢、某月總共多少觀看時直接讀這張，不要自己從明細加總。
      {{ doc('news_dept_definition') }}
      {{ doc('traffic_vs_video_level') }}
    columns:
      - name: month_start
        description: 月份第一天（依觀看發生日）。
        data_tests: [not_null]
      - name: year_month
        description: 月份字串（YYYY-MM）。
      - name: dept_scope
        description: "{{ doc('dept_scope') }}"
      - name: platform
        description: "{{ doc('platform') }}"
      - name: views
        description: 當月實際發生的觀看數，總體成效的 KPI（IG 含 Stories；YouTube / FB 含付費）。
      - name: video_views_only
        description: 不含 Stories 的觀看數。
      - name: story_views
        description: IG 影片類 Stories 的觀看數（只有 IG 有）。
      - name: engaged_views
        description: YouTube 的 Engaged views（輔助參考）。KPI 仍是 views；跨 2026-08-27 比較時一併列出。
      - name: paid_views
        description: 付費觀看，已包含在 views 裡。
      - name: watch_time_hours
        description: 當月觀看時數。
      - name: days_with_data
        description: 當月有資料的天數。少於當月天數代表資料不完整（例如本月、或資料起始月）。
      - name: source_method
        description: 資料算法。IG 出現 reel_snapshot_delta 代表 2026-06 之前的快照算法，通常比 API 偏高 10～20%。
      - name: is_current_month
        description: 是否為本月（台北時間），本月資料不完整。

saved_queries:
  - name: news_dept_social_performance
    label: 新聞部社群成效
    description: >
      「新聞部社群成效」的預設答案：新聞部三個單位（Newsroom + Talks + Connected）
      在四個平台的每日流量觀看數（當月實際發生的觀看），依月份、單位、平台切分。
      各平台觀看門檻不同，請各平台看自己的趨勢，不要跨平台比較優劣。
    query_params:
      metrics:
        - traffic_views
        - traffic_engaged_views
      group_by:
        - "TimeDimension('metric_time', 'month')"
        - "Dimension('traffic__dept_scope')"
        - "Dimension('traffic__platform')"

  - name: newsroom_social_performance
    label: Newsroom 社群成效
    description: 只看 Newsroom（新聞台）在四個平台的每日流量觀看數，依月份與平台切分。
    query_params:
      metrics:
        - traffic_views
        - traffic_engaged_views
      group_by:
        - "TimeDimension('metric_time', 'month')"
        - "Dimension('traffic__platform')"
      where:
        - "{{ Dimension('traffic__dept_scope') }} = 'newsroom'"
