name: taiwanplus_dbt
version: "1.0.0"
config-version: 2
profile: taiwanplus_dbt

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

# 所有 description 都寫回 BigQuery 的 table / column 描述，
# 讓 BQ 的 Gemini / Conversational Analytics 也讀得到同一份定義。
#
# prod 的 dataset 配置（dev 一律寫進 target.schema，見 macros/generate_schema_name.sql）：
#   dbt_internal      staging / intermediate，不給人直接查
#   news_dept_social  新聞部社群成效主表、日期表、對照表
#   social_hub        與舊 view 同名的相容層，Looker Studio 接這裡
models:
  taiwanplus_dbt:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: dbt_internal
    intermediate:
      +materialized: view
      +schema: dbt_internal
    marts:
      +materialized: view
      +schema: news_dept_social
    social_hub:
      +materialized: view
      +schema: social_hub

seeds:
  taiwanplus_dbt:
    +persist_docs:
      relation: true
      columns: true
    +schema: news_dept_social
    dept_accounts:
      +column_types:
        active_to: date
