# YouTube owner 報表的事件驅動鏈（Cloud Workflows: youtube-owner-chain）
#
#   owner transfer 每次執行結束 → Pub/Sub 通知 → Eventarc → 這個 workflow
#     1. 判斷要不要重建（限流）：有新報表日就馬上重建；只是舊日期被修正，距上次重建滿 20 小時才重建
#        （owner transfer 每天會重寫舊 partition 十幾次，2026-11 每次都全量重建＋跑 dbt 檢查，BQ 一個月 2.7 TiB）
#     2. MERGE daily_detailed_summary
#     3. 同時重建 video_news_livestream、video_news_broad
#     4. 跑 dbt 每日檢查（Cloud Run Job dbt-daily-checks），等它跑完
#   任何一步失敗 → workflow 執行失敗 → Cloud Monitoring 寄信。
#
# 為什麼不用固定時間：報表日 D 的資料第一次進來落在 D+2 的 13:37–23:51 之間，
# 之後還會被修正重寫，用時間猜一定會漏。SQL 在 orchestration/sql/，以 stored procedure 部署。
#
# 手動執行（不帶事件）：gcloud workflows run youtube-owner-chain --location=asia-east1 --data='{}'
# 不管有沒有新資料都重建：--data='{"force": true}'
main:
  params: [event]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: asia-east1
          - trigger: "manual"
          - force: ${default(map.get(event, "force"), false)}
    - parse_event:
        # transfer 的通知內容是 TransferRun JSON；手動執行時沒有，就記為 manual
        try:
          assign:
            - run: ${json.decode(base64.decode(event.data.message.data))}
            - trigger: ${"transfer run " + run.state + ", runTime " + run.runTime}
        except:
          as: e
          steps:
            - keep_manual:
                assign:
                  - trigger: "manual"
    - log_trigger:
        call: sys.log
        args:
          text: ${"觸發：" + trigger}

    # has_new_data：owner 表有比衍生表新的寫入（含舊日期被修正）
    # new_report_date：owner 出現衍生表還沒有的報表日；和 dbt test
    #   assert_youtube_summary_caught_up_with_owner 比的是同一組（traffic_source_a3 vs daily_detailed_summary），
    #   新報表日一定馬上重建，所以限流不會讓那個 test 誤報
    # hours_since_refresh：衍生表最久沒更新的那張距今幾小時
    # 整個查詢約 50 KB（MAX(_PARTITIONDATE) 只讀 metadata）
    - check_new_data:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            useLegacySql: false
            location: ${location}
            query: |
              WITH o AS (
                SELECT MAX(last_modified_time) AS owner_modified
                FROM `youtube_taiwanplus_owner.__TABLES__`
                WHERE table_id IN ('p_content_owner_basic_a4_owner', 'p_content_owner_reach_basic_a1_owner',
                                   'p_content_owner_video_metadata_a4_owner', 'p_content_owner_traffic_source_a3_owner')
              ), d AS (
                SELECT MIN(last_modified_time) AS derived_modified
                FROM `youtube_channel_summary.__TABLES__`
                WHERE table_id IN ('daily_detailed_summary', 'video_news_livestream', 'video_news_broad')
              )
              SELECT
                o.owner_modified > d.derived_modified AS has_new_data,
                (SELECT FORMAT_DATE('%Y%m%d', MAX(_PARTITIONDATE))
                 FROM `youtube_taiwanplus_owner.p_content_owner_traffic_source_a3_owner`)
                  > (SELECT MAX(date) FROM `youtube_channel_summary.daily_detailed_summary`) AS new_report_date,
                TIMESTAMP_DIFF(CURRENT_TIMESTAMP(), TIMESTAMP_MILLIS(d.derived_modified), HOUR) AS hours_since_refresh
              FROM o CROSS JOIN d
        result: check
    - read_check:
        assign:
          - has_new_data: ${check.rows[0].f[0].v == "true"}
          - new_report_date: ${check.rows[0].f[1].v == "true"}
          - hours_since_refresh: ${int(default(check.rows[0].f[2].v, "999"))}
          - min_hours_between_corrections: 20
    - stop_if_no_new_data:
        switch:
          - condition: ${not force and not has_new_data}
            steps:
              - log_skip:
                  call: sys.log
                  args:
                    text: "owner 表沒有比衍生表新的資料，結束"
              - skip:
                  return: "skipped: no new owner data"
          - condition: ${not force and not new_report_date and hours_since_refresh < min_hours_between_corrections}
            steps:
              - log_throttle:
                  call: sys.log
                  args:
                    text: ${"只有舊日期被修正，距上次重建 " + string(hours_since_refresh) + " 小時（未滿 " + string(min_hours_between_corrections) + "），結束"}
              - throttle:
                  return: '${"skipped: correction only, last refresh " + string(hours_since_refresh) + "h ago"}'

    # 2. 先 MERGE 每日彙總，再同時重建兩張影片表
    - refresh_daily_summary:
        call: bq_call
        args:
          project: ${project}
          location: ${location}
          procedure: refresh_daily_detailed_summary
    - refresh_video_tables:
        parallel:
          branches:
            - livestream:
                steps:
                  - call_livestream:
                      call: bq_call
                      args:
                        project: ${project}
                        location: ${location}
                        procedure: refresh_video_news_livestream
            - broad:
                steps:
                  - call_broad:
                      call: bq_call
                      args:
                        project: ${project}
                        location: ${location}
                        procedure: refresh_video_news_broad

    # 4. 衍生表更新完才跑 dbt 檢查；connector 會等 job 執行結束，
    #    回傳的是 long-running operation，Execution 在 response 底下。
    #    檢查沒過（freshness / test）時 connector 會 raise OperationError（metadata.failedCount > 0）。
    #    這種情況不讓 workflow 失敗：dbt-daily-checks 自己的告警已經會寄信，workflow 再失敗只是重複的信
    #    （2026-11-15 YouTube 晚送，一個問題寄了兩種信、共 9 封）。workflow 告警只留給這條鏈自己的步驟；
    #    jobs.run 呼叫本身出錯（權限、job 不存在）仍會往上丟，讓 workflow 失敗。
    - run_dbt_checks:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: ${"projects/" + project + "/locations/" + location + "/jobs/dbt-daily-checks"}
          result: op
        except:
          as: e
          steps:
            - classify_error:
                switch:
                  - condition: ${"OperationError" in default(map.get(e, "tags"), []) and default(map.get(e, ["operation", "metadata", "failedCount"]), 0) > 0}
                    steps:
                      - log_checks_failed:
                          call: sys.log
                          args:
                            severity: WARNING
                            text: ${"衍生表已更新，但 dbt-daily-checks 沒過（另有告警信）：" + e.operation.metadata.name}
                      - checks_failed:
                          return: ${"refreshed; dbt checks FAILED, see dbt-daily-checks alert (" + e.operation.metadata.name + ")"}
            - reraise:
                raise: ${e}
    - check_dbt_result:
        switch:
          - condition: ${default(map.get(op, ["response", "failedCount"]), 0) > 0}
            return: ${"refreshed; dbt checks FAILED, see dbt-daily-checks alert (" + op.response.name + ")"}
    - done:
        return: ${"refreshed; dbt checks passed (" + op.response.name + ")"}

# 呼叫一個 stored procedure，等 job 結束；job 失敗就讓整個 workflow 失敗
bq_call:
  params: [project, location, procedure]
  steps:
    - insert_job:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: ${project}
          body:
            jobReference:
              location: ${location}
            configuration:
              query:
                useLegacySql: false
                query: ${"CALL `youtube_channel_summary." + procedure + "`()"}
        result: job
    - check_job:
        switch:
          - condition: ${"errorResult" in job.status}
            raise: ${procedure + " 失敗：" + json.encode_to_string(job.status.errorResult)}
    - log_done:
        call: sys.log
        args:
          text: ${procedure + " 完成（job " + job.jobReference.jobId + "）"}
