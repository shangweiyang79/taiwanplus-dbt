version: 2

# 原表 = Python 腳本 / Cloud Run / BQ 排程查詢寫進來的表，dbt 只讀不寫。
# 這裡就是 dbt 專案與 TaiwanPlus_api、news_classification_project 兩個 repo 之間的「合約」。
# freshness 門檻依更新頻率設定（只有 error 會讓每日檢查失敗並寄信，warn 只記在 log）：
#   每天更新的表用小時，門檻 = 一天中最長的正常延遲 + 約 1 天緩衝，漏一天載入，隔天 12:00 的檢查就會報錯。
#   檢查可能在早上載入前跑（workflow 隨時會觸發），所以「最長的正常延遲」要算載入前那一刻。
#   每週更新的表 8 天警告、14 天報錯；每月更新或不定期上傳的表不設。
#   2026-10-29 量過 10/23–10/28 每天 12:00 的延遲，幾天之間幾乎沒有差異。

sources:
  - name: youtube
    database: "{{ target.database }}"
    schema: youtube_channel_summary
    tables:
      - name: video_news_broad
        description: >
          新聞部（Newsroom + Talks + Connected）YouTube 影片表，一列一支影片，數字為累計值。
          由 Workflow `youtube-owner-chain` 在 owner 報表有新資料時重建（取代原本每天 13:00 的排程查詢），只含 2026-01-01 之後發布的影片。
          dept_scope = 'newsroom' 的部分與 video_news_livestream 完全一致（2026-10-12 實測影片清單相同、觀看數 0 差異）。
          定義見 news_classification_project/deploy/sql/video_news_broad.sql。
        # 以「最新一支影片的發布時間」判斷新鮮度。表雖然每天重建，但 YouTube owner 報表
        # 本身有延遲，2026-10-12 實測最新影片是 5 天前發布，所以門檻放寬到 7 / 10 天。
        config:
          loaded_at_field: time_published
          freshness:
            warn_after: {count: 7, period: day}
            error_after: {count: 10, period: day}
        columns:
          - name: video_id
            data_tests: [unique, not_null]
          - name: dept_scope
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['newsroom', 'talks', 'connected']
      - name: daily_detailed_summary
        description: >
          YouTube 頻道 × 日的每日流量（date 為 YYYYMMDD 字串），含 19 個頻道，新聞部只取 seed youtube_channels 裡的 5 個。
          total_views 含付費（paid_views）。
        # 最新 date 平常是 T-3，延遲最長約 3.7 天（D+2 下午新資料進來前）。
        # YouTube 晚一天只出 warn，晚兩天以上才報錯。
        config:
          loaded_at_field: "CAST(PARSE_DATE('%Y%m%d', date) AS TIMESTAMP)"
          freshness:
            warn_after: {count: 4, period: day}
            error_after: {count: 5, period: day}
      - name: video_news_category
        description: >
          雲端分類 pipeline（Cloud Run news-classify-monthly，每月 5 號）寫入的 YouTube 影片主題分類，
          以 YouTube video_id 為主鍵。source = 'shorts_gemini' 的是 Shorts，分類另由 social_hub.yt_shorts 提供。

  - name: youtube_owner
    database: "{{ target.database }}"
    schema: youtube_taiwanplus_owner
    description: YouTube Reporting API 的 content owner 報表（BQ Data Transfer 每日匯入）。
    tables:
      - name: p_content_owner_basic_a4_owner
        description: 影片 × 日的基本指標（views、engaged_views…），date 為 YYYYMMDD 字串。用來算每日 engaged views。
      - name: p_content_owner_video_metadata_a4_owner
        description: 影片 metadata（含 channel_id），依 _PARTITIONDATE 每日快照，取最新分區。

  - name: instagram
    database: "{{ target.database }}"
    schema: Instagram_data
    description: Instagram reels 的每日累計快照，同一支 reel 會有很多列，必須取最新 data_date 那一列，不能 SUM。
    # data_date 是快照當天，每天約 10:00 前載入，延遲最長約 1.1 天（載入前）。
    config:
      loaded_at_field: "CAST(data_date AS TIMESTAMP)"
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 48, period: hour}
    tables:
      - name: News
        description: Newsroom 的 IG 帳號。
      - name: Talks
        description: Talks 的 IG 帳號。沒有 caption / thumbnail_url 欄位。
      - name: daily_ig_summary_report
        description: >
          IG 每日流量（舊報表）：各帳號每天的 Total Plays 總和減去前一天。dbt 已不使用這張表
          （API 漏抓時會產生大幅負數），觀看數改由 stg_daily__instagram_reel_deltas 逐支 reel 相減，正常月份結果與本表相同。
        config:
          freshness: null
      - name: daily_ig_summary_report_new
        description: >
          IG 每日流量（2026-06-01 起）：觀看來自官方 API（account_daily_insights）。
          時數欄位自 2026-10-27 起改讀 ig_daily_watch_hours，不再有負數；dbt 只取這張的觀看數，時數直接讀 ig_daily_watch_hours。
          News / Talks / Connected / Social(Program) 為欄；Program 不屬於新聞部。
          定義見 TaiwanPlus_api/sql/daily_ig_summary_report_new.sql。
        # 以下三張 view 的日期是「前一天」，延遲最長約 2.1 天，門檻比 source 層級多一天
        config:
          loaded_at_field: "CAST(Date AS TIMESTAMP)"
          freshness:
            warn_after: {count: 54, period: hour}
            error_after: {count: 72, period: hour}
      - name: ig_daily_watch_hours
        description: >
          IG 每日觀看時數，一列 = 日 × 帳號（Social = Program / News / Connected / Talks），不會有負數。
          2026-10-25 前讀 ig_daily_watch_hours_history（人工校正的 IG_daily_traffic.xlsx，ig_wh_history_bq.py 上傳，source_method = excel_history）；
          2026-10-26 起逐支 reel 差分、累計值取歷史最大值（source_method = reel_delta）。
          granularity = 'month' 的列（2024 年）是記在月底的整月總數，不能當單日用。
          定義見 TaiwanPlus_api/sql/ig_daily_watch_hours.sql。
        config:
          loaded_at_field: "CAST(date AS TIMESTAMP)"
          freshness:
            warn_after: {count: 54, period: hour}
            error_after: {count: 72, period: hour}
      - name: ig_stories_pivot_daily
        description: IG Stories 每日觀看（只含影片類 Stories），News / Talks / Connected / Social 為欄。
        config:
          loaded_at_field: "CAST(date AS TIMESTAMP)"
          freshness:
            warn_after: {count: 54, period: hour}
            error_after: {count: 72, period: hour}
      - name: Connected
        description: >
          Connected 的 IG 帳號，2026-07-04 停更（實測最後一則 reel 發布於 2026-07-10），歷史資料保留。
          已停更所以不檢查 freshness。沒有 caption / thumbnail_url 欄位。
        config:
          freshness: null

  - name: facebook
    database: "{{ target.database }}"
    schema: Facebook_data
    tables:
      - name: TaiwanPlus_news
        description: >
          Newsroom FB 粉專 × 日的每日流量。page_video_views 為 3 秒觀看（含付費，另有 page_video_views_paid）；
          page_video_view_time 實測推斷單位為分鐘（2026-09 平均每次約 25 秒）。
        # date 是前一天，每天約 09:50 載入，延遲最長約 2.1 天
        config:
          loaded_at_field: "CAST(date AS TIMESTAMP)"
          freshness:
            warn_after: {count: 54, period: hour}
            error_after: {count: 72, period: hour}
      - name: TaiwanPlus_news_videos
        description: Newsroom 的 FB 影片，一列一支影片，數字為累計值。
        # updated_at 是實際寫入時間（每天約 10:20），延遲最長約 1 天
        config:
          loaded_at_field: updated_at
          freshness:
            warn_after: {count: 36, period: hour}
            error_after: {count: 48, period: hour}
        columns:
          - name: video_id
            data_tests: [unique, not_null]

  - name: x
    database: "{{ target.database }}"
    schema: X_data
    tables:
      - name: daily_traffic
        description: Newsroom X 帳號 × 日的每日流量（x_daily_traffic_bq.py 每週二寫入，同一天保留最新一次匯出）。
        config:
          loaded_at_field: "CAST(date AS TIMESTAMP)"
          freshness:
            warn_after: {count: 9, period: day}
            error_after: {count: 16, period: day}
      - name: post_metrics
        description: Newsroom 的 X 貼文成效，x_analytics_bq.py 每週由 X 後台匯出檔寫入，一列一則貼文。
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after: {count: 8, period: day}
            error_after: {count: 14, period: day}
        columns:
          - name: total_video_views
            description: walkthrough §3.6 (d)：不應該有 NULL。
            data_tests: [not_null]

  - name: social_hub
    database: "{{ target.database }}"
    schema: social_hub
    tables:
      - name: post_map
        description: >
          CMS Social Media Feed 的 VOD × 平台貼文對照表（socialmediafeed.py 每週寫入），只涵蓋 Newsroom。
          自然鍵為 (vod_id, platform, post_id)。
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after: {count: 8, period: day}
            error_after: {count: 14, period: day}
      - name: yt_shorts
        description: >
          YouTube Shorts 清單與分類（yt_shorts_bq.py 每月從活頁簿 shorts 分頁整表覆蓋）。
          是判斷 YouTube 影片是否為 Shorts 的唯一依據，不能用影片長度判斷。
          目前只涵蓋 TaiwanPlus News 與 Taiwan Explained 兩個頻道。
        columns:
          - name: video_id
            data_tests: [unique, not_null]
      - name: tag_aliases
        description: tag 同義詞對照（tag_aliases_bq.py 從 tag_aliases.json 上傳）。
      - name: vod_content_category
        description: CMS 匯出的 VOD content_category（vod_content_category_bq.py 不定期上傳）。
      - name: vertical_crosswalk
        description: 直式影片跨平台推論配對（vertical_crosswalk.py 每月整表覆蓋）。
